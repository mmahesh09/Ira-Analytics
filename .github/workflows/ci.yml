name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# third-party actions are pinned to commit SHAs (tags can be moved); Dependabot keeps them current
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rw_test
          POSTGRES_PASSWORD: rw_test_local
          POSTGRES_DB: rankwise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rw_test -d rankwise_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # migrations and the database tests both use this throwaway database
      DATABASE_URL: postgresql://rw_test:rw_test_local@localhost:5432/rankwise_test
      TEST_DATABASE_URL: postgresql://rw_test:rw_test_local@localhost:5432/rankwise_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Better Auth tables (created by the frontend in production)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/auth_stub.sql
      - name: Migrations apply and match the models
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # generates next-env.d.ts and the route types (LayoutProps, PageProps) that tsc needs; both are gitignored
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://ira-analytics.onrender.com
          BACKEND_URL: https://ira-analytics.onrender.com

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # every commit, so a secret committed and later removed is still found
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit bandit
      - name: Python dependencies have no known vulnerabilities
        run: pip-audit -r backend/requirements.txt
      - name: Python static analysis (medium severity and up)
        run: bandit -q -r backend/app -ll
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: npm production dependencies have no high or critical advisories
        working-directory: frontend
        # allowlisted after review (SECURITY.md): GHSA-5j98-mcp5-4vw2 is the glob *CLI* (-c/--cmd), pulled in by
        # @opennextjs/cloudflare at build time only; Rankwise never runs it on untrusted input
        run: npx --yes audit-ci@7.1.0 --high --skip-dev --allowlist GHSA-5j98-mcp5-4vw2
