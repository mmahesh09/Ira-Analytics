# Render Blueprint: the Rankwise API on Render's free tier (Render → New → Blueprint → this repo).
# Database: Neon free Postgres (Render's free Postgres expires after 30 days). Secrets are prompted for
# on first creation (sync: false) and never live in git. See DEPLOY.md → "Render (free)".
services:
  - type: web
    name: rankwise-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free # 512 MB: no room for Chromium; switch to standard (2 GB) and set the two browser flags to true to enable it
    region: singapore
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: WITH_BROWSER # Docker build arg: leave Chromium + Lighthouse out of the image
        value: "false"
      - key: BROWSER_CHECKS
        value: "false"
      - key: LOCAL_LIGHTHOUSE
        value: "false"
      - key: ROLE
        value: api
      - key: EMBEDDED_WORKER # no separate worker on the free tier: run scheduled audits inside the API
        value: "true"
      - key: CORS_ORIGINS
        value: https://rankwise-xi.vercel.app
      - key: PUBLIC_API_URL
        value: https://rankwise-api.onrender.com
      - key: DATABASE_URL # Neon connection string (postgresql://…?sslmode=require)
        sync: false
      - key: PAGESPEED_API_KEY # Speed scores on the free tier come from PageSpeed Insights
        sync: false
      - key: OPENROUTER_API_KEY # AI visibility + AI rewrites
        sync: false
