# Render Blueprint: the Rankwise API on Render's free tier (Render → New → Blueprint → this repo).
# Database: Neon free Postgres (Render's free Postgres expires after 30 days). Secrets are prompted for
# on first creation (sync: false) and never live in git. See DEPLOY.md → "Render (free)".
services:
  - type: web
    name: rankwise-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free # 512 MB: no room for Chromium; switch to standard (2 GB) and set the two browser flags to true to enable it
    region: ohio # same AWS region as the Neon database (us-east-2)
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: WITH_BROWSER # Docker build arg: leave Chromium + Lighthouse out of the image
        value: "false"
      - key: BROWSER_CHECKS
        value: "false"
      - key: LOCAL_LIGHTHOUSE
        value: "false"
      - key: ROLE
        value: api
      - key: APP_ENV # fail closed on unsafe settings, hide /docs, HSTS on API responses
        value: production
      - key: EMBEDDED_WORKER # no separate worker on the free tier: run scheduled audits inside the API
        value: "true"
      - key: TRUSTED_PROXY_HOPS # Render's proxy appends the real client IP to X-Forwarded-For (anonymous preview limits)
        value: "1"
      - key: PREVIEW_SALT # hashes visitor IPs in preview_usage
        generateValue: true
      - key: ADMIN_EMAILS # who may read /app/admin/feedback (verified email required)
        sync: false
      - key: GOOGLE_SHEETS_ID # feedback copy to Google Sheets (DEPLOY.md); optional
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ORIGINS
        value: https://rankwise-xi.vercel.app
      - key: PUBLIC_API_URL
        value: https://rankwise-api.onrender.com
      - key: DATABASE_URL # Neon connection string (postgresql://…?sslmode=require)
        sync: false
      - key: PAGESPEED_API_KEY # Speed scores on the free tier come from PageSpeed Insights
        sync: false
      - key: OPENROUTER_API_KEY # AI visibility + AI rewrites
        sync: false
