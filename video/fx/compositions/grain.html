<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Rankwise grain plate</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      2 s seamless film-grain loop on 50% grey. Remotion loops it with mix-blend-mode: overlay,
      where grey is neutral, so only the grain itself shows. Grain from the registry's
      grain-overlay component (compositions/components/grain-overlay.html), desaturated.
    -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #808080;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #808080;
      }
      @keyframes hf-grain-noise {
        0%,
        100% {
          transform: translate(0, 0);
        }
        10% {
          transform: translate(-5%, -5%);
        }
        20% {
          transform: translate(-10%, 5%);
        }
        30% {
          transform: translate(5%, -10%);
        }
        40% {
          transform: translate(-5%, 15%);
        }
        50% {
          transform: translate(-10%, 5%);
        }
        60% {
          transform: translate(15%, 0);
        }
        70% {
          transform: translate(0, 10%);
        }
        80% {
          transform: translate(-15%, 0);
        }
        90% {
          transform: translate(10%, 5%);
        }
      }
      #grain-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #grain-overlay .grain-texture {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        filter: grayscale(1) contrast(1.6);
        opacity: 0.55;
        animation: hf-grain-noise 0.5s steps(1) 4;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="grain" data-start="0" data-duration="2" data-width="1920" data-height="1080">
      <div id="grain-clip" class="clip" data-start="0" data-duration="2" data-track-index="0" style="position: absolute; inset: 0">
        <div id="grain-overlay"><div class="grain-texture"></div></div>
      </div>
    </div>
    <script>
      window.__timelines["grain"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
